<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10241e" />
    <meta name="description" content="Runas Rotas: aventura de salas, jefes y un grimorio de páginas cifradas. Solo teclado." />
    <title>Runas Rotas · El bosque olvidado</title>
  </head>
  <body>
    <main id="game">
      <canvas id="canvas" width="960" height="540" tabindex="0" aria-label="Juego de plataformas controlado con teclado"></canvas>
      <div id="hud" hidden>
        <div><small>EL ERRANTE</small><div id="health"></div><div id="mana"></div></div>
        <div class="location"><small>BOSQUE DE LAS RUNAS ROTAS</small><strong id="zone"></strong></div>
        <div class="hud-keys" id="hud-keys"></div>
      </div>
      <div id="bossbar" hidden><span id="boss-name"></span><div><i></i></div></div>
      <div id="toast" role="status"></div>
      <div id="overlay"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
